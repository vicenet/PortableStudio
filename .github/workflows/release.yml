name: Release installers

# Builds the Windows setup (.exe) and macOS installer (.pkg) and attaches them to the GitHub release.
# Runs on version tags (v1.2.3), or manually for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach installers to (e.g. v0.3.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Make sure the release exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check the tag
        run: |
          if ! printf %s "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Not a version tag: $TAG"; exit 1
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "PortableStudio ${TAG#v}" \
              --notes "Download the installer for your system below. See the README for details."

  windows:
    name: Windows installer (.exe)
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      # Only used to decide whether to sign (docs/SIGNING.md).
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag pushes build that tag; manual runs build the branch they were started from.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/package.js
      - name: Build setup with Inno Setup
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\dist\PortableStudio-$v" installer\windows\PortableStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Signs the setup with a code-signing certificate when the repository has one (see docs/SIGNING.md).
      # Without the secrets the installer stays unsigned, as before.
      - name: Sign the installer
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-Item dist\*-setup.exe).FullName
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code -ne 0) { exit $code }
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG (Get-Item dist\*-setup.exe).FullName --clobber --repo $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/*-setup.exe

  macos:
    name: macOS installer (.pkg)
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      # Only used to decide whether to sign (docs/SIGNING.md).
      APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tag pushes build that tag; manual runs build the branch they were started from.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/package.js
      - run: sh installer/macos/build-pkg.sh
      # Signs and notarises the package with an Apple Developer ID when the repository has one
      # (see docs/SIGNING.md). Without the secrets the package stays unsigned, as before.
      - name: Sign and notarise the package
        if: env.APPLE_INSTALLER_CERT_P12_BASE64 != ''
        env:
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_INSTALLER_CERT_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v "$KEYCHAIN" | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          PKG="$(ls dist/*.pkg)"
          productsign --sign "$IDENTITY" --keychain "$KEYCHAIN" "$PKG" "$PKG.signed"
          mv "$PKG.signed" "$PKG"
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$PKG"
          security delete-keychain "$KEYCHAIN"
      - name: Check the package
        run: pkgutil --payload-files dist/*.pkg | head -5 || pkgutil --check-signature dist/*.pkg || true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.pkg --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installer
          path: dist/*.pkg
